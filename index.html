<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group Trivia Game</title>
</head>
<body>
  <h1>Trivia Game</h1>

  <div id="setup">
    <label>Number of Players:</label>
    <input type="number" id="numPlayers" min="1" value="2"><br><br>

    <label>Rounds per Player:</label>
    <input type="number" id="roundsPerPlayer" min="1" value="2"><br><br>

    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="game" style="display:none;">
    <h2 id="turnInfo"></h2>
    <div id="question"></div>
    <div id="answers"></div>
    <p id="scoreboard"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
