<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Group Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Group Quiz Game</h1>

    <div id="setup">
      <label>Enter player names (one per line):</label><br>
      <textarea id="playerNames" rows="5" cols="30"></textarea><br><br>

      <label>Number of Rounds:</label>
      <input type="number" id="rounds" min="1" /><br><br>

      <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game" style="display:none;">
      <h2 id="question"></h2>
      <div id="choices"></div>
      <p id="status"></p>
      <p id="scoreboard"></p>
    </div>

    <div id="final" style="display:none;">
      <h2>Game Over!</h2>
      <div id="finalScoreboard"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
