<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>Group Quiz Game</h1>
    
    <div id="setup">
      <h3>Enter player names (comma-separated):</h3>
      <textarea id="playerNames" rows="2"></textarea>
      
      <h3>Number of rounds:</h3>
      <input type="number" id="rounds" min="1" max="100" value="5"/>

      <br/>
      <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game" style="display:none;">
      <h3 id="roundCounter"></h3>
      <h2 id="question"></h2>
      <div id="choices"></div>
      <p id="status"></p>
      <p id="currentPlayer"></p>
    </div>

    <div id="result" style="display:none;">
      <h2>Game Over!</h2>
      <ul id="scoreboard"></ul>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
